[test]
coverage = true
coverageSkipTestFiles = true
coverageThreshold = 0.7

coveragePathIgnorePatterns = [
  "**/*.spec.ts",
  "**/*.test.ts",
  "src/utils/**",
  "src/services/r2/presign.ts",
  "src/services/rate/getRankingList.ts",
  "src/middlewares/**",
  "src/routes/**",
  "src/services/user/createGuestUser.ts",
  "src/services/user/getUserByDeviceId.ts",
  "src/services/user/serviceAdapter.ts",
  "src/services/user/updateUser.ts",
  "src/services/file/uploadPhoto.ts",
  "src/services/photo/autoHide.ts",
  "src/services/r2/r2Client.ts",
  "src/services/auth/service.ts",
  "*.config.js",
  "src/*.ts",
  "test/**/**",
  "src/routes/admin/**",
]

preload = ["./test/setup.ts"]