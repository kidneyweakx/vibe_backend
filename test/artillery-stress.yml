config:
  target: 'http://localhost:8181'
  phases:
    # Quick ramp up to stress test
    - duration: 10
      arrivalRate: 1
      rampTo: 10
    # High load stress test
    - duration: 60
      arrivalRate: 50
    # Peak stress test
    - duration: 30
      arrivalRate: 100
    # Cool down
    - duration: 10
      arrivalRate: 10
      rampTo: 1
  defaults:
    headers:
      Content-Type: 'application/json'
  plugins:
    metrics-by-endpoint:
      useOnlyRequestNames: true

scenarios:
  - name: "Stress Test - High Load"
    weight: 70
    flow:
      - get:
          url: "/api/file/test"
          name: "File API Test"
      
      - get:
          url: "/api/rate/random-photos"
          name: "Get Random Photos"
      
      - post:
          url: "/api/rate/photo"
          name: "Rate Photo"
          json:
            raterId: "stress-rater-{{ $randomString() }}"
            photoId: "stress-photo-{{ $randomString() }}"
            type: "like"
      
      - get:
          url: "/api/tags/all"
          name: "Get All Tags"
  
  - name: "Stress Test - Auth Endpoints"
    weight: 30
    flow:
      - post:
          url: "/api/auth/google/verify"
          name: "Google Auth Verify"
          json:
            idToken: "stress-token-{{ $randomString() }}"
            accessToken: "stress-access-{{ $randomString() }}"
      
      - get:
          url: "/api/user/profile/user-{{ $randomString() }}"
          name: "Get Random User Profile"
